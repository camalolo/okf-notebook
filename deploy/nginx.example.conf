# Example nginx reverse-proxy config for a Notebook deployment.
#
# Copy to /etc/nginx/sites-available/<your-domain> and replace:
#   - notebook.example.com  → your domain
#   - the ssl_certificate paths → your certificates (e.g. certbot's)
#
# nginx is a pure reverse proxy: UI, API, and SSE all go to Express on
# localhost:3002, which serves the built UI itself and handles SPA routing.

server {
    listen 80;
    server_name notebook.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name notebook.example.com;

    ssl_certificate /etc/letsencrypt/live/notebook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notebook.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # Recommended: deny dotfiles (.env, .git, .htaccess, …) and set standard
    # security headers — use your distribution's snippets or write your own:
    # include snippets/block-dotfiles.conf;
    # include snippets/security-headers.conf;

    access_log /var/log/nginx/notebook.access.log;
    error_log /var/log/nginx/notebook.error.log;

    # Everything — UI, API, SSE — proxied to Express.
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE support for streaming chat. The server also sends a `: ping`
        # comment every 25s as heartbeat, so this is defense in depth for
        # long LLM thinking pauses.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
