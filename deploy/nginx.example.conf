server {
    listen 80;
    server_name notebook.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name notebook.example.com;

    ssl_certificate /etc/letsencrypt/live/notebook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notebook.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include snippets/block-dotfiles.conf;  # deny .env, .git, .htaccess, etc.
    include snippets/security-headers.conf;

    access_log /var/log/nginx/notebook.access.log;
    error_log /var/log/nginx/notebook.error.log;

    # Everything — UI, API, SSE — proxied to Express.
    # Express serves static files from public/ and handles SPA routing,
    # so nginx is a pure reverse proxy (no root, try_files, or alias).
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE support for streaming chat. The server also sends a `: ping`
        # comment every 25s as heartbeat, so this is defense in depth for
        # long LLM thinking pauses (observed >3min before first token).
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
